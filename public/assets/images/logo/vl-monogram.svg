<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%" fill="none" role="img" aria-label="VL Consulting Partners Monograma">
  <defs>
    <!-- Gradiente Azul Corporativo -->
    <linearGradient id="vlBlueGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1C5385" />
      <stop offset="45%" stop-color="#123B60" />
      <stop offset="100%" stop-color="#081C30" />
    </linearGradient>

    <!-- Gradiente Dorado Premium Metálico -->
    <linearGradient id="vlGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A57E32" />
      <stop offset="25%" stop-color="#C9A45A" />
      <stop offset="50%" stop-color="#FCEAB3" />
      <stop offset="75%" stop-color="#C9A45A" />
      <stop offset="100%" stop-color="#916E28" />
    </linearGradient>

    <!-- Bisel sutil blanco -->
    <linearGradient id="vlBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="vlShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#vlShadow)">
    <!-- Letra V en relieve -->
    <!-- Contorno/Bisel exterior blanco de la V -->
    <path d="M 22 28 C 22 24, 25 22, 36 22 L 72 22 C 60 26, 52 35, 52 46 L 76 112 L 104 38 C 104 28, 97 25, 88 22 L 126 22 C 117 26, 112 32, 108 42 L 76 130 C 73 138, 68 138, 65 130 L 26 42 C 22 33, 22 29, 22 28 Z"
          fill="#FFFFFF" opacity="0.85" />
    <path d="M 24 30 C 24 26, 28 24, 38 24 L 70 24 C 62 28, 54 36, 54 48 L 76 110 L 102 40 C 102 30, 96 27, 89 24 L 122 24 C 115 28, 110 34, 106 43 L 75 128 C 73 134, 69 134, 67 128 L 29 44 C 25 35, 24 32, 24 30 Z"
          fill="url(#vlBlueGrad)" />

    <!-- Letra L en relieve -->
    <!-- Contorno/Bisel exterior blanco de la L -->
    <path d="M 98 28 C 98 24, 101 22, 112 22 L 146 22 C 137 26, 130 32, 130 44 L 130 114 L 168 114 C 178 114, 182 108, 185 98 L 185 134 L 98 134 C 108 130, 114 124, 114 112 L 114 44 C 114 32, 107 26, 98 28 Z"
          fill="#FFFFFF" opacity="0.85" />
    <path d="M 100 30 C 100 26, 103 24, 114 24 L 143 24 C 135 28, 132 34, 132 46 L 132 116 L 166 116 C 176 116, 180 110, 183 100 L 183 132 L 101 132 C 110 128, 116 122, 116 110 L 116 46 C 116 34, 109 28, 100 30 Z"
          fill="url(#vlBlueGrad)" />

    <!-- Trazo Diagonal Dorado Dinámico (Elemento clave de identidad) -->
    <!-- Curva ascendente que corta diagonalmente el monograma -->
    <path d="M 46 124 C 62 120, 80 102, 100 78 C 122 52, 142 34, 172 32 C 158 42, 142 56, 126 78 C 104 108, 80 126, 46 124 Z"
          fill="#000000" opacity="0.3" transform="translate(1, 2)" />
    <path d="M 46 124 C 62 120, 80 102, 100 78 C 122 52, 142 34, 172 32 C 158 42, 142 56, 126 78 C 104 108, 80 126, 46 124 Z"
          fill="url(#vlGoldGrad)" />
    <!-- Brillo superior del trazo dorado -->
    <path d="M 52 122 C 70 116, 90 98, 110 74 C 130 50, 150 36, 170 33 C 156 38, 138 52, 122 72 C 102 96, 80 114, 52 122 Z"
          fill="#FFF4D0" opacity="0.5" />
  </g>
</svg>
